name: Test Skills

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md files
        run: |
          for file in skills/**/SKILL.md workflows/**/WORKFLOW.md;
          do
            if ! yq -e '.name | test("^[a-z0-9-]+$")' "$file" >/dev/null;
            then echo "Invalid frontmatter in $file"; exit 1;
            fi
          done
      - name: Lint install script
        run: bash -n scripts/install.sh