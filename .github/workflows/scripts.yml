name: scripts

on:
  push:
    paths: ["scripts/**", "global/**", "rules/**", "skills/**", "agents/**", "claude-md-files/**", "bundles.tsv"]
  pull_request:
    paths: ["scripts/**", "global/**", "rules/**", "skills/**", "agents/**", "claude-md-files/**", "bundles.tsv"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node scripts/check-bundles.mjs
      - run: node --test scripts/test/*.mjs
      - run: node skills/skill-architect/scripts/validate.mjs skills/*/
      - run: shellcheck scripts/setup.sh scripts/utils.sh scripts/test/*.sh
      - run: bash scripts/test/setup.test.sh
      - run: sh scripts/test/trail-autobuild.test.sh
