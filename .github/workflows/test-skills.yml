name: Test Skills

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills against the spec
        run: node skills/skill-architect/scripts/validate.mjs skills/*/
      - name: Lint install script
        run: bash -n scripts/install.sh scripts/utils.sh
